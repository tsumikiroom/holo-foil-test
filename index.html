<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gold Foil — prototype v2</title>
<style>
  :root { --ink: #3a2a05; --chip: rgba(255,250,230,.82); color-scheme: light; }
  html, body { margin: 0; height: 100%; background: #c9a227; overflow: hidden; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ui {
    position: fixed; left: 0; right: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    font: 13px/1.5 system-ui, sans-serif; color: var(--ink);
  }
  .ui > * { pointer-events: auto; }
  .ui button {
    background: var(--chip); color: var(--ink); border: 0; border-radius: 999px;
    padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .status { background: var(--chip); border-radius: 999px; padding: 4px 12px; text-align: center; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <button id="gyro" hidden>傾きで動かす</button>
  <div class="status" id="status">マウスを動かすと反射が動く</div>
</div>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform vec2 uTilt;   // -1〜1。面は動かさず、光の当たり方だけを変える
uniform float uTile;  // マス目の大きさ（px）

float hash(float n) { return fract(sin(n) * 43758.5453); }

void main() {
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 g = p / uTile;
  vec2 cell = floor(g);
  vec2 l = fract(g) - .5;
  float chk = mod(cell.x + cell.y, 2.);

  // マスの中心まわりに放射状のヘアライン → 反射は「中心を通る帯」になり、傾きで帯が回る
  float th = atan(l.y, l.x);
  float phi = -2.3 + uTilt.x * 1.7 - uTilt.y * 1.1;
  float d = th - phi + chk * 1.5707963;   // 市松の隣どうしは 90° ずらす
  float amt = clamp(length(uTilt), 0., 1.);
  float spec = pow(abs(cos(d)), mix(2.8, 4.5, amt));

  // 細かいヘアライン（角度ごとの細い濃淡）
  float hair = hash(floor(th * 90.) + cell.x * 17. + cell.y * 131.) - .5;
  spec = clamp(spec + hair * .06, 0., 1.);

  // 面全体の光のむら：光が来る側は明るい黄、遠い側はオレンジに沈む
  vec2 uv = (p - .5 * uRes) / uRes.y;
  vec2 ld = vec2(cos(phi), sin(phi));
  float glob = dot(uv, ld) + uTilt.y * .25;
  float warm = 1. - smoothstep(-.75, .15, glob);
  float band = exp(-pow((glob - .1 + uTilt.x * .3) * 2.6, 2.));

  vec3 dark = vec3(.66, .46, .04);
  vec3 mid  = vec3(.96, .80, .10);
  vec3 hi   = vec3(1.0, .98, .78);
  vec3 col = mix(dark, mid, smoothstep(.0, .55, spec));
  col = mix(col, hi, smoothstep(.62, 1., spec));
  col = mix(col, col * vec3(1.05, .58, .22) + vec3(.06, .0, .0), warm * .55);
  col += band * vec3(.10, .08, .03);

  gl_FragColor = vec4(col, 1.);
}
</script>
<script>
const canvas = document.getElementById('c');
const statusEl = document.getElementById('status');
const gl = canvas.getContext('webgl');

const vsSrc = 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }';
function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(aLoc); gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);
const uRes = gl.getUniformLocation(prog, 'uRes');
const uTilt = gl.getUniformLocation(prog, 'uTilt');
const uTile = gl.getUniformLocation(prog, 'uTile');

let dpr = 1;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize); resize();

// 目標の傾き → バネで追いかける（少し遅れて反射が流れる）
const target = { x: 0, y: 0 }, cur = { x: 0, y: 0 }, vel = { x: 0, y: 0 };
const STIFF = .07, DAMP = .75;
const clamp1 = v => Math.max(-1, Math.min(1, v));

function frame() {
  for (const k of ['x', 'y']) {
    vel[k] = (vel[k] + (target[k] - cur[k]) * STIFF) * DAMP;
    cur[k] += vel[k];
  }
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform2f(uTilt, cur.x, cur.y);
  // マス目は画面の短い辺の約 1/4.5（80〜140px）
  gl.uniform1f(uTile, Math.round(Math.max(80, Math.min(140, Math.min(innerWidth, innerHeight) / 4.5))) * dpr);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// マウス / 指: 画面中央からのずれを傾きとして扱う
addEventListener('pointermove', e => {
  if (gyroOn) return;
  target.x = clamp1((e.clientX / innerWidth - .5) * 2);
  target.y = clamp1((e.clientY / innerHeight - .5) * 2);
});
document.documentElement.addEventListener('pointerleave', () => {
  if (!gyroOn) { target.x = 0; target.y = 0; }
});

// 傾きセンサー（HTTPS のページでだけ動く）
let gyroOn = false, base = null;
const gyroBtn = document.getElementById('gyro');
if ('DeviceOrientationEvent' in window && matchMedia('(pointer: coarse)').matches) gyroBtn.hidden = false;
if (!window.isSecureContext) statusEl.textContent += '（http なので傾きセンサーは使えません）';

function onOrient(e) {
  if (e.beta == null) return;
  if (!base) base = { b: e.beta, g: e.gamma };   // ボタンを押したときの持ち方を正面にする
  target.x = clamp1((e.gamma - base.g) / 25);
  target.y = clamp1((e.beta - base.b) / 25);
}

gyroBtn.addEventListener('click', async () => {
  if (gyroOn) {
    removeEventListener('deviceorientation', onOrient);
    gyroOn = false; base = null; target.x = 0; target.y = 0;
    gyroBtn.textContent = '傾きで動かす'; statusEl.textContent = '傾きセンサー: オフ';
    return;
  }
  try {
    // iOS 13+ はタップの中で許可を求める必要がある
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      const r = await DeviceOrientationEvent.requestPermission();
      if (r !== 'granted') { statusEl.textContent = '傾きセンサーが許可されませんでした'; return; }
    }
    addEventListener('deviceorientation', onOrient);
    gyroOn = true; base = null;
    gyroBtn.textContent = '傾きを止める';
    statusEl.textContent = '傾きセンサー: オン';
    setTimeout(() => {
      if (gyroOn && !base) statusEl.textContent = '傾きセンサーの値が届きません（このページでは止められています）';
    }, 2000);
  } catch (err) {
    statusEl.textContent = '傾きセンサーを開始できません: ' + err.message;
  }
});
</script>
</body>
</html>
